  <rect x="40" y="44" width="4" height="4" fill="#a07c28"/>
  <!-- Clipboard (right hand) -->
  <rect x="46" y="30" width="10" height="14" fill="#d4c9a8"/>
  <rect x="48" y="28" width="6" height="4" fill="#8b6914"/>
  <rect x="48" y="34" width="6" height="2" fill="#2c2416"/>
  <rect x="48" y="38" width="6" height="2" fill="#2c2416"/>
  <rect x="48" y="42" width="4" height="2" fill="#2c2416"/>
  <!-- Legs (khaki) -->
  <rect x="22" y="50" width="8" height="10" fill="#c2a968"/>
  <rect x="34" y="50" width="8" height="10" fill="#c2a968"/>
  <!-- Boots (tan) -->
  <rect x="20" y="58" width="12" height="6" fill="#a0785a"/>
  <rect x="32" y="58" width="12" height="6" fill="#a0785a"/>
