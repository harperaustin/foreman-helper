  <rect x="40" y="44" width="4" height="4" fill="#ff00ff"/>
  <!-- Clipboard (right hand) -->
  <rect x="46" y="30" width="10" height="14" fill="#d4c9a8"/>
  <rect x="48" y="28" width="6" height="4" fill="#5c4033"/>
  <rect x="48" y="34" width="6" height="2" fill="#2c2416"/>
  <rect x="48" y="38" width="6" height="2" fill="#2c2416"/>
  <rect x="48" y="42" width="4" height="2" fill="#2c2416"/>
  <!-- Legs -->
  <rect x="22" y="50" width="8" height="10" fill="#3f51b5"/>
  <rect x="34" y="50" width="8" height="10" fill="#3f51b5"/>
  <!-- Boots -->
  <rect x="20" y="58" width="12" height="6" fill="#1a237e"/>
  <rect x="32" y="58" width="12" height="6" fill="#1a237e"/>
