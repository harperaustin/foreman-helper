<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges" image-rendering="pixelated">
  <!-- Hard Hat -->
  <rect x="20" y="4" width="24" height="4" fill="#303030"/>
  <rect x="16" y="8" width="32" height="6" fill="#303030"/>
  <rect x="14" y="14" width="36" height="2" fill="#1c1c1c"/>
  <!-- Face -->
  <rect x="22" y="16" width="20" height="16" fill="#e8b87a"/>
  <!-- Eyes -->
  <rect x="26" y="20" width="4" height="4" fill="#2c2416"/>
  <rect x="34" y="20" width="4" height="4" fill="#2c2416"/>
  <!-- Mouth -->
  <rect x="28" y="28" width="8" height="2" fill="#2c2416"/>
  <!-- Body / Overalls -->
  <rect x="20" y="32" width="24" height="18" fill="#3f51b5"/>
