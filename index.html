<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foreman Pipeline HQ</title>
  <link rel="icon" href="assets/foreman-mascot.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <img src="assets/foreman-mascot.svg" alt="Foreman mascot" class="header-mascot">
    <h1>Foreman Pipeline HQ</h1>
    <p>🏗️ Building your code, one agent at a time</p>
    <div class="theme-toggle" role="group" aria-label="Theme selector">
      <button class="theme-btn active" data-theme="dark" aria-pressed="true" title="Dark mode">🌙</button>
      <button class="theme-btn" data-theme="light" aria-pressed="false" title="Light mode">☀️</button>
      <button class="theme-btn" data-theme="colorful" aria-pressed="false" title="Colorful mode">🌈</button>
      <button class="theme-btn" data-theme="professional" aria-pressed="false" title="Professional mode">💼</button>
    </div>
    <button class="demo-btn" id="demo-toggle" aria-pressed="false" aria-label="Run pipeline demo animation">▶ Demo</button>
  </header>
  <div class="caution-stripe"></div>
  <nav class="tab-nav" role="tablist">
    <button class="tab-btn active" data-tab="pipeline" role="tab" aria-selected="true" id="tab-pipeline" aria-controls="panel-pipeline">🏗️ Pipeline</button>
    <button class="tab-btn" data-tab="game" role="tab" aria-selected="false" id="tab-game" aria-controls="panel-game">🎮 Game</button>
    <button class="tab-btn" data-tab="bug-squash" role="tab" aria-selected="false" id="tab-bug-squash" aria-controls="panel-bug-squash">🐛 Bug Squash</button>
  </nav>
  <main>
    <div id="panel-pipeline" class="tab-panel active" role="tabpanel" aria-labelledby="tab-pipeline">
      <div id="pipeline"></div>
      <div id="agent-detail"></div>
    </div>
    <div id="panel-game" class="tab-panel" role="tabpanel" aria-labelledby="tab-game">
      <h2 class="game-title">Dodge the Bugs! 🐛</h2>
      <p class="game-instructions">Use ← → arrow keys to dodge falling bugs. Survive as long as you can!</p>
      <canvas id="game-canvas" width="480" height="400"></canvas>
      <div class="game-hud"><span id="game-score">Score: 0</span><button id="game-start-btn" class="demo-btn">▶ Start</button></div>
    </div>
    <div id="panel-bug-squash" class="tab-panel" role="tabpanel" aria-labelledby="tab-bug-squash">
      <h2 class="game-title">Bug Squash! 🔨</h2>
      <p class="game-instructions">Watch the foreman take down a pesky bug!</p>
      <canvas id="bug-squash-canvas" width="480" height="300"></canvas>
    </div>
  </main>
  <script defer src="js/arrow-geometry.js"></script>
  <script defer src="js/game.js"></script>
  <script defer src="js/bug-squash.js"></script>
  <script src="js/app.js" defer></script>
</body>
</html>
